<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <title>Couples Quiz TV</title>
  <link rel="stylesheet" href="styles/main.css?v=5">
  <script>
    /* There are no dev tools on a TV, so the game's own script errors are kept for the
     * debug overlay (Up x5) and shown on screen only if the game fails to start.
     * Errors from scripts the TV browser injects into every page (TV Bro does this)
     * arrive as a bare "Script error." with no file; they are not ours and are ignored. */
    window.CQ_ERRORS = [];
    window.onerror = function (msg, src, line) {
      var ours = src && src.indexOf(location.protocol + '//' + location.host) === 0;
      if (!ours || /^Script error\.?$/.test(String(msg))) { return true; }
      var text = msg + ' (' + src.split('/').pop() + ':' + line + ')';
      window.CQ_ERRORS.push(text);
      var started = window.CQ && window.CQ.App && window.CQ.App.router && window.CQ.App.router.name;
      var box = document.getElementById('fatal');
      if (!started && box) {
        box.style.display = 'block';
        box.appendChild(document.createTextNode(text + '\n'));
      }
      return false;
    };
  </script>
</head>
<body>
  <div id="viewport">
  <div id="stage">
    <div id="safe">
      <div id="screen"><div class="loading">Loading…</div></div>
      <div id="hints"></div>
    </div>
    <div id="modal-layer"></div>
    <div id="toast"></div>
    <div id="debug"></div>
    <pre id="fatal"></pre>
  </div>
  </div>

  <script src="src/settings.js?v=5"></script>
  <script src="src/sound.js?v=5"></script>
  <script src="src/ui.js?v=5"></script>
  <script src="src/debug.js?v=5"></script>
  <script src="src/router.js?v=5"></script>
  <script src="src/screens/title.js?v=5"></script>
  <script src="src/screens/settings.js?v=5"></script>
